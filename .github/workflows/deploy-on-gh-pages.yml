# À chaque push sur main : assemble le site (dashboard + données) et le publie sur GitHub Pages.
# Résultat : https://ndelucin.github.io/rowerboard/
name: Deploy on GH Pages

# QUAND : à chaque push sur main, ou à la main depuis l'onglet Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# DROITS : ce que le workflow a le droit de faire.
permissions:
  contents: read    # lire le code du dépôt
  pages: write      # publier sur GitHub Pages
  id-token: write   # prouver à Pages que le déploiement vient bien de ce workflow

jobs:
  deploy:
    runs-on: ubuntu-latest   # une machine temporaire, détruite à la fin
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 1. Récupère le code du dépôt sur la machine.
      - uses: actions/checkout@v4

      # 2. Construit le site : un dossier _site/ qui contient le dashboard
      #    et, dedans, le dossier data/. C'est la seule étape "à nous".
      - run: |
          mkdir _site
          cp -r dashboard/. _site/
          cp -r data _site/data

      # 3. Emballe _site/ dans une archive.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 4. Demande à GitHub Pages de publier cette archive.
      - id: deploy
        uses: actions/deploy-pages@v4
